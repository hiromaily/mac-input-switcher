name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          brew install shellcheck
          make lint

      - name: Test
        run: make test

      - name: Build
        run: make build VERSION="${GITHUB_REF_NAME#v}"

      - name: Package
        run: |
          codesign --force --sign - build/MacInputSwitcher.app
          ditto -c -k --keepParent build/MacInputSwitcher.app MacInputSwitcher.zip
          shasum -a 256 MacInputSwitcher.zip > MacInputSwitcher.zip.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v1.0.0-rc1 are prereleases, which releases/latest skips.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            MacInputSwitcher.zip MacInputSwitcher.zip.sha256 \
            --generate-notes $prerelease
