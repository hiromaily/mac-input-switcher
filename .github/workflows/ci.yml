name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          brew install shellcheck
          make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
